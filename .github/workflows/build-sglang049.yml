
name: Build SGLang 0.4.9 image

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile.sglang049
      - .github/workflows/build-sglang049.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase GHCR namespace
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eidf-llm-dev" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.sglang049
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sglang0.4.9-base
