apiVersion: batch/v1
kind: Job
metadata:
  generateName: xh-dev-
  namespace: eidf029ns
  labels:
    eidf/user: s2522871-infk8s
    kueue.x-k8s.io/queue-name: eidf029ns-user-queue
    kueue.x-k8s.io/max-exec-time-seconds: "900"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        eidf/user: s2522871-infk8s
    spec:
      restartPolicy: Never
      containers:
        - name: dev
          image: ghcr.io/REPLACE_WITH_YOUR_GITHUB_USERNAME/eidf-llm-dev:cuda12.8-v1
          imagePullPolicy: Always
          command: ["/bin/bash", "-lc"]
          args: ["echo 'CPU development pod ready'; cd /workspace; sleep 780"]
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 8Gi
          volumeMounts:
            - name: research-storage
              mountPath: /workspace
      volumes:
        - name: research-storage
          persistentVolumeClaim:
            claimName: xh-gpu-research
